name: Napcat-Plus CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAPCAT_VERSION: 4.18.42+napcat-plus.0.1.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm --filter napcat-test exec vitest run
      - run: pnpm --filter napcat-webui-frontend run test:console
      - run: pnpm run build:webui
      - run: pnpm run build:shell
      - run: pnpm run build:plugin-builtin
      - uses: actions/upload-artifact@v6
        with:
          name: Napcat-Plus.Shell
          path: packages/napcat-shell/dist
          retention-days: 14
          if-no-files-found: error
