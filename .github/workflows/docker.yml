name: Build Napcat-Plus Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to this repository's GHCR package
        type: boolean
        default: true
      version:
        description: Console version embedded in the image
        type: string
        default: 0.5.3

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building console version: ${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Napcat-Plus
            org.opencontainers.image.description=NapCat-based QQ bot console with reliable login, built-in GSCore bridge and diagnostics
            org.opencontainers.image.licenses=LicenseRef-NapCat

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: napcat-plus:verify
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONSOLE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image before publishing any version tags
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          trap 'docker rm -f verify >/dev/null 2>&1 || true' EXIT
          docker run -d --name verify -e WEBUI_TOKEN=verify-token-not-for-use -p 16099:6099 napcat-plus:verify
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:16099/webui/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:16099/webui/ >/dev/null
          docker inspect verify --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "NAPCAT_PLUS_VERSION=${EXPECTED_VERSION}"
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          base = 'http://127.0.0.1:16099/api'
          payload = json.dumps({'hash': hashlib.sha256(b'verify-token-not-for-use.napcat').hexdigest()}).encode()
          req = urllib.request.Request(base + '/auth/login', data=payload, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=10) as response:
              credential = json.load(response)['data']['Credential']
          req = urllib.request.Request(base + '/Console/status', headers={'Authorization': 'Bearer ' + credential})
          with urllib.request.urlopen(req, timeout=10) as response:
              assert json.load(response)['data']['version'] == os.environ['EXPECTED_VERSION']
          PY

      - name: Publish the verified image
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag napcat-plus:verify "$tag"
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Napcat-Plus image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
