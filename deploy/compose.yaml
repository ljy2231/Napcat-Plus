name: ${COMPOSE_PROJECT_NAME:-napcat-plus}
services:
  console:
    image: napcat-plus:0.5.2
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WEBUI_TOKEN: ${WEBUI_TOKEN:?Set a strong WEBUI_TOKEN in your private .env file}
      NAPCAT_PLUS_PINNED: "1"
    ports:
      # Localhost by default. Use SSH forwarding or an authenticated TLS proxy.
      - "${BIND_HOST:-127.0.0.1}:${WEBUI_PORT:-6099}:6099"
    volumes:
      - ${NAPCAT_PLUS_DIR:-/opt/napcat-plus}/qq:/app/.config/QQ
      - ${NAPCAT_PLUS_DIR:-/opt/napcat-plus}/config:/app/napcat/config
      - ${NAPCAT_PLUS_DIR:-/opt/napcat-plus}/plugins:/app/napcat/plugins
    networks:
      - bot-network
    stop_grace_period: 30s

networks:
  bot-network:
    name: ${BOT_NETWORK:-napcat-plus-network}
